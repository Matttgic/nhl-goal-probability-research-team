name: Live NHL FR anytime-goal coverage probe

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"
  push:
    branches:
      - main
    paths:
      - .github/live-fr-anytime-goal-probe-trigger

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install project
        run: uv sync
      - name: Probe all upcoming NHL games for French anytime-goal coverage
        id: coverage
        run: uv run python scripts/live_fr_anytime_goal_coverage_probe.py
      - name: Open one issue when French NHL scorer props become available
        if: ${{ steps.coverage.outputs.available == 'true' }}
        uses: actions/github-script@v7
        env:
          BOOKMAKERS: ${{ steps.coverage.outputs.bookmakers }}
          EVENTS_WITH_MARKET: ${{ steps.coverage.outputs.events_with_market }}
        with:
          script: |
            const title = 'French NHL anytime-goal coverage detected';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            if (!issues.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body: `The automated coverage probe found French-region NHL player_goal_scorer_anytime data.\n\nEvents with market: ${process.env.EVENTS_WITH_MARKET}\nBookmakers: ${process.env.BOOKMAKERS || 'see workflow log'}\n\nNo raw prices are included in this issue.`
              });
            }
