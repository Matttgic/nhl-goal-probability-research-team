name: Live NHL FR anytime-goal coverage probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/live-fr-anytime-goal-probe-trigger

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install project
        run: uv sync
      - name: Probe current French anytime-goal coverage without logging prices
        run: uv run python scripts/live_fr_anytime_goal_coverage_probe.py
