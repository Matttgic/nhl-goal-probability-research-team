name: Real NHL player-goal smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/real-nhl-trigger

permissions:
  contents: read

jobs:
  real-nhl-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install project
        run: uv sync

      - name: Fetch real NHL data and run leakage-safe smoke model
        run: uv run python scripts/real_nhl_player_goal_smoke.py

      - name: Upload real NHL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-nhl-smoke-output
          path: |
            reports/real_nhl_smoke.md
            workspace/real_nhl/**
          if-no-files-found: warn
