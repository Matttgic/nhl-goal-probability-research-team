name: Real NHL player-goal V2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/real-nhl-v2-trigger

permissions:
  contents: read

jobs:
  real-nhl-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install project
        run: uv sync

      - name: Run richer leakage-safe NHL model comparison
        run: uv run python scripts/real_nhl_player_goal_v2.py

      - name: Upload NHL V2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-nhl-v2-output
          path: |
            reports/real_nhl_v2.md
            workspace/real_nhl_v2/**
          if-no-files-found: warn
