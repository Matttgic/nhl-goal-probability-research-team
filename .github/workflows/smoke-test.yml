name: Python project smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "scripts/**"
      - "pyproject.toml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run python -m compileall -q src scripts
