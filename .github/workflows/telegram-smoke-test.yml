name: Telegram smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/telegram-test-trigger

permissions:
  contents: read

jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install project
        run: uv sync
      - name: Send Telegram test
        run: uv run python scripts/telegram_smoke_test.py
