name: Unit tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install core project
        run: uv sync
      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -p 'test_*.py' -v
