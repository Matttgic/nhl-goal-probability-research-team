name: Upcoming NHL experimental forecasts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/nhl-upcoming-report-trigger
      - .github/workflows/upcoming-predictions.yml
      - scripts/upcoming_nhl_predictions.py
      - src/nhl_goal_probability_research_team/upcoming.py

permissions:
  contents: write

concurrency:
  group: upcoming-nhl-report
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install forecast dependencies only
        run: python -m pip install 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'scikit-learn>=1.5,<2'
      - uses: actions/cache@v4
        with:
          path: workspace/nhl_public_cache
          key: nhl-public-cache-v1-${{ github.run_id }}
          restore-keys: nhl-public-cache-v1-
      - name: Verify pregame features, evaluation and forecast pipeline
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Generate next 48 hours from free NHL endpoints
        id: generate
        run: python scripts/upcoming_nhl_predictions.py
      - name: Show readable forecast in this run
        if: always()
        run: |
          if test -f reports/upcoming_predictions.md; then
            cat reports/upcoming_predictions.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish the latest report, including a failed-data status
        if: always() && steps.generate.outcome != 'skipped'
        run: |
          if ! test -f reports/upcoming_predictions.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/upcoming_predictions.md reports/upcoming_predictions.csv reports/upcoming_validation.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'reports: refresh experimental upcoming NHL forecasts'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Save forecast artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upcoming-nhl-forecasts
          path: |
            reports/upcoming_predictions.md
            reports/upcoming_predictions.csv
            reports/upcoming_validation.json
          if-no-files-found: ignore
